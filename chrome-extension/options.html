<!DOCTYPE html>
<html>
  <head>
    <title>Audio Summarizer Settings</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 16px;
      }
      input, textarea {
        width: 100%;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <h2>Audio Summarizer Settings</h2>

    <label for="openaiToken">OpenAI Token:</label>
    <input type="text" id="openaiToken" placeholder="sk-..." />

    <label for="transcriptionModel">Transcription Model:</label>
    <select id="transcriptionModel">
      <option value="gpt-4o-transcribe">gpt-4o-transcribe</option>
      <option value="gpt-4o-mini-transcribe">gpt-4o-mini-transcribe</option>
      <option value="whisper-1">whisper-1</option>
    </select>

    <label for="summaryModel">Summary Model:</label>
    <input type="text" id="summaryModel" placeholder="leave empty for default" />

    <label for="summarySystemPrompt">Summary System Prompt:</label>
    <textarea id="summarySystemPrompt" style="height:200px" placeholder="leave empty for default"></textarea>

    <label for="summaryPrompt">Summary Prompt:</label>
    <textarea id="summaryPrompt" style="height:400px" placeholder="e.g. Summarize this meeting..."></textarea>

    <hr />

    <button id="saveSettings">Save Settings</button>

    <script src="options.js"></script>
  </body>
</html>
